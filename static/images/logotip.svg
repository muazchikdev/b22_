<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Градиент для иконки -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Иконка: Пересечение книги и цифровых пикселей/схем -->
    <!-- Левая страница -->
    <path d="M 50 85 C 30 75 10 80 10 80 L 10 25 C 10 25 30 20 50 30 Z" 
          fill="none" stroke="url(#primary-grad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Правая страница -->
    <path d="M 50 85 C 70 75 90 80 90 80 L 90 25 C 90 25 70 20 50 30 Z" 
          fill="none" stroke="url(#primary-grad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Корешок -->
    <line x1="50" y1="30" x2="50" y2="85" stroke="url(#primary-grad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Электронные узлы/пиксели над книгой -->
    <circle cx="50" cy="15" r="4" fill="#06B6D4"/>
    <circle cx="30" cy="10" r="3" fill="#2563EB"/>
    <circle cx="70" cy="10" r="3" fill="#06B6D4"/>
    <line x1="50" y1="30" x2="50" y2="19" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2,2"/>
    <line x1="30" y1="23" x2="30" y2="13" stroke="#2563EB" stroke-width="2" stroke-dasharray="2,2"/>
    <line x1="70" y1="23" x2="70" y2="13" stroke="#06B6D4" stroke-width="2" stroke-dasharray="2,2"/>
  </g>

  <!-- Текстовый блок -->
  <text x="120" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#1E293B">
    Электронная
  </text>
  <text x="120" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#2563EB" letter-spacing="1">
    Библиотека
  </text>
</svg>
