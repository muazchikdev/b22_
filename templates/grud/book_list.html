{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/book_list.css' %}">
        
        <h2>Список книг</h2>
        <div class="container">
            
            {% for book in books %}
                <div class="book_cards">
                    <h3>{{ book.title }}</h3>
                    <p>{{ book.author }}</p>
                    <a href="{% url 'book_detail' book.id %}" class="btn">Подробнее</a>
                </div>
            {% endfor %}
        </div>

{% endblock %}
